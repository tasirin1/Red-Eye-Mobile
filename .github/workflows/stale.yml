name: Stale

# Issue TIDAK pernah di-stale-kan di repo ini: daftar issue terbuka adalah
# antrean kerja temuan audit (aturan issue-first) — menutupnya otomatis
# menghilangkan temuan. Hanya PR yang di-stale-kan.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: write

jobs:
  stale:
    name: Tutup PR tidak aktif
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-issue-stale: -1
          days-before-pr-stale: 21
          days-before-issue-close: -1
          days-before-pr-close: 14
          stale-pr-message: "PR ini tidak ada aktivitas 21 hari dan ditandai stale. Push commit baru atau balas di sini kalau masih dikerjakan — bila 14 hari tidak ada respons, PR akan ditutup otomatis."
          close-pr-message: "PR ditutup otomatis karena tidak ada aktivitas. Silakan buka ulang bila masih relevan (rebase ke main terbaru dan pastikan CI hijau)."
          exempt-pr-labels: "dependencies"
          stale-pr-label: "stale"
          operations-per-run: 200
