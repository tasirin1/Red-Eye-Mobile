name: CodeQL

# Kelompokkan per ref seperti workflow build (issue
# #1641): run lama pada ref yang sama dibatalkan agar
# push/PR/jadwal tak menumpuk membuang menit CI. Tag
# dikecualikan dari pembatalan, meniru pola build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      GRADLE_SHA256: bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: java-kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # Paket "tools" sudah dihapus dari repositori Google (deprecated);
          # cukup platform-tools — platform/build-tools diunduh AGP saat autobuild.
          packages: 'platform-tools'

      - name: Cache Gradle 8.14.3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /opt/gradle-8.14.3
          key: gradle-8.14.3-bin-${{ env.GRADLE_SHA256 }}

      - name: Setup Gradle 8.14.3
        run: |
          if [ -x /opt/gradle-8.14.3/bin/gradle ] && [ "$(cat /opt/gradle-8.14.3/.sha256 2>/dev/null)" = "$GRADLE_SHA256" ]; then
            echo "Gradle 8.14.3 dari cache terverifikasi."
          else
            rm -rf /opt/gradle-8.14.3 /tmp/gradle.zip
            wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -O /tmp/gradle.zip
            echo "$GRADLE_SHA256  /tmp/gradle.zip" | sha256sum -c -
            unzip -q /tmp/gradle.zip -d /opt
            echo "$GRADLE_SHA256" > /opt/gradle-8.14.3/.sha256
            rm -f /tmp/gradle.zip
          fi
          echo "/opt/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:java-kotlin"
