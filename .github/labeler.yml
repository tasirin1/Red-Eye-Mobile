# Mapping path -> label otomatis (workflow .github/workflows/labeler.yml).
# Label di bawah harus sudah ada di repository (Issues -> Labels),
# kecuali `dependencies` yang dibuat otomatis oleh Dependabot.
app:
  - any:
      - app/src/main/**
      - app/build.gradle
      - app/src/test/**
      - app/src/androidTest/**

ci:
  - any:
      - .github/workflows/**
      - .github/dependabot.yml
      - .github/labeler.yml
      - .github/CODEOWNERS
      - tools/**
      - scripts/**
      - gradle/**
      - build.gradle
      - settings.gradle
      - gradle.properties

docs:
  - any:
      - README.md
      - CHANGELOG.md
      - AGENTS.md
      - docs/**
      - "*.md"
