name: Verifikasi Path

# Terpisah dari Build APK (issue #1699): build.yml memakai
# paths-ignore untuk **.md dan LICENSE, dan pengabaian itu
# dulu mematikan SELURUH workflow — termasuk job verifikasi
# — untuk changeset khusus-docs, padahal permukaan docs
# tetap bisa membawa temuan gerbang (nama berkas, pesan,
# contoh bertanda). Workflow ini TANPA paths-ignore agar
# verifikasi selalu jalan; job yang sama tetap ada di
# build.yml sebagai gerbang build/rilis (duplikasi jalan
# pada push biasa adalah harga yang disengaja).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verifikasi:
    name: Cek path yang berubah
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verifikasi path (tanpa SDK Android)
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Skrip murni-Python: acuan yatim, XML, aturan repo, hapusan salah,
          # paritas resource, secret, cakupan uji metode diubah.
          # Gagal di sini = build APK tidak jalan.
          BASE="$PR_BASE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$EVENT_BEFORE"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            case "$GITHUB_REF" in
              refs/tags/*)
                BASE=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
                if [ -z "$BASE" ]; then
                  BASE=$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)
                fi
                ;;
              *)
                # Cabang baru (issue #893): before kosong/nol berarti
                # seluruh cabang baru bagi remote — cadangan lama
                # sha^ hanya memindai commit ujung. BASE menjadi
                # commit akar agar seluruh riwayat cabang ikut
                # terpindai (isi tiap commit + pesan + diff bersih).
                BASE=$(git rev-list --max-parents=0 "${GITHUB_SHA}" 2>/dev/null | head -n 1 || true)
                ;;
            esac
          fi
          if [ -n "$BASE" ]; then
            # Dua titik (issue #838): tiga titik = beda simetris,
            # memindai juga commit yang sudah duduk di main dan tak
            # disentuh perubahan ini (PR bersih bisa gagal dan tak
            # bisa diperbaiki dari sisi PR).
            python3 tools/verifikasi-path.py --rentang "$BASE..${{ github.sha }}"
          else
            python3 tools/verifikasi-path.py
          fi
      - name: Cek cepat (vektor 0.x, secret, binary)
        run: bash scripts/cek-cepat.sh
      - name: Uji regresi gerbang Python
        # Issue #1789: kasus-kasus kanal penilai gerbang
        # yang dulu hanya dibuktikan baterai sandbox
        # sekali pakai kini ter-commit dan berjalan di
        # CI — regresi kanal yang sama tertangkap di
        # sini, bukan oleh audit berikutnya.
        run: python3 -m unittest discover -s tools/tests
