name: Auto-merge dependabot

# Hanya untuk PR Dependabot. Dependabot di repo ini hanya memantau
# github-actions; PR yang menyentuh dependensi Gradle (bila kelak ekosistem
# gradle ditambahkan) tetap manual. Pola ditiru dari tasirin-download-manager.
on:
  pull_request_target:
    types: [opened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge PR Dependabot
    runs-on: ubuntu-24.04
    if: github.actor == 'dependabot[bot]'
    steps:
      # Murni API (tanpa checkout): semua perintah gh memakai -R eksplisit.
      - name: Deteksi perubahan dependensi Gradle
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Gagal-TERTUTUP: kegagalan API / daftar kosong tidak boleh jatuh
          # ke "bukan dependensi Gradle" lalu auto-merge aktif.
          if ! FILES=$(gh pr view ${{ github.event.pull_request.number }} -R ${{ github.repository }} --json files --jq '.files[].path'); then
            echo "::error::Gagal membaca daftar file PR - auto-merge dibatalkan."
            exit 1
          fi
          if [ -z "$FILES" ]; then
            echo "::error::Daftar file PR kosong - auto-merge dibatalkan."
            exit 1
          fi
          echo "File berubah di PR:"
          echo "$FILES"
          if echo "$FILES" | grep -qE '^(app/build\.gradle|build\.gradle|settings\.gradle|gradle/|gradle\.properties)'; then
            echo "GRADLE_DEPS=true" >> "$GITHUB_ENV"
          fi

      - name: Komentar panduan (PR dependensi Gradle)
        if: env.GRADLE_DEPS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} -R ${{ github.repository }} --body "PR ini mengubah dependensi Gradle. Sesuai aturan repo, perubahan dependensi ditangani manual: pastikan build CI hijau dulu, lalu merge manual."

      - name: Auto-merge setelah CI hijau (bukan dependensi Gradle)
        if: env.GRADLE_DEPS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} -R ${{ github.repository }} --merge --auto
