name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verifikasi:
    name: Cek path yang berubah
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verifikasi path (tanpa SDK Android)
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Skrip murni-Python: acuan yatim, XML, aturan repo, hapusan salah,
          # paritas resource, secret, cakupan uji metode diubah.
          # Gagal di sini = build APK tidak jalan.
          BASE="$PR_BASE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$EVENT_BEFORE"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) BASE=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true) ;;
            esac
            if [ -z "$BASE" ]; then
              BASE=$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)
            fi
          fi
          if [ -n "$BASE" ]; then
            python3 tools/verifikasi-path.py --rentang "$BASE...${{ github.sha }}"
          else
            python3 tools/verifikasi-path.py
          fi
      - name: Cek cepat (vektor 0.x, secret, binary)
        run: bash scripts/cek-cepat.sh

  build:
    needs: [verifikasi]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GRADLE_SHA256: d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle 8.9
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /opt/gradle-8.9
          key: gradle-8.9-bin-${{ env.GRADLE_SHA256 }}

      - name: Setup Gradle 8.9
        run: |
          if [ -x /opt/gradle-8.9/bin/gradle ] && [ "$(cat /opt/gradle-8.9/.sha256 2>/dev/null)" = "$GRADLE_SHA256" ]; then
            echo "Gradle 8.9 dari cache terverifikasi."
          else
            rm -rf /opt/gradle-8.9 /tmp/gradle.zip
            wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
            echo "$GRADLE_SHA256  /tmp/gradle.zip" | sha256sum -c -
            unzip -q /tmp/gradle.zip -d /opt
            echo "$GRADLE_SHA256" > /opt/gradle-8.9/.sha256
            rm -f /tmp/gradle.zip
          fi
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Cek tag cocok versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          nama=$(sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' app/build.gradle | head -1)
          echo "tag=$tag versionName=$nama"
          if [ "$tag" != "$nama" ]; then
            echo "GAGAL: tag v$tag tidak cocok dengan versionName $nama"; exit 1
          fi

      - name: Unit test (logika murni)
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace 2>&1 | tee /tmp/unit.log
          s=${PIPESTATUS[0]}
          if [ "$s" -ne 0 ] && grep -Eqi 'could not (resolve|get|download)|connection (reset|timed out)|read timed out|temporary failure|unable to access' /tmp/unit.log; then
            echo "Kegagalan jaringan terdeteksi, mencoba sekali lagi"
            sleep 30
            gradle testDebugUnitTest --stacktrace && s=0
          fi
          exit "$s"
        env:
          SYNC_INTERVAL: ${{ secrets.SYNC_INTERVAL }}

      - name: Detekt (gaya Kotlin)
        run: gradle detekt --stacktrace

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.p12
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APKs
        run: |
          set +e
          gradle assembleDebug assembleRelease --stacktrace 2>&1 | tee /tmp/build.log
          s=${PIPESTATUS[0]}
          if [ "$s" -ne 0 ] && grep -Eqi 'could not (resolve|get|download)|connection (reset|timed out)|read timed out|temporary failure|unable to access' /tmp/build.log; then
            echo "Kegagalan jaringan terdeteksi, mencoba sekali lagi"
            sleep 30
            gradle assembleDebug assembleRelease --stacktrace && s=0
          fi
          exit "$s"
        env:
          SYNC_INTERVAL: ${{ secrets.SYNC_INTERVAL }}
          KEYSTORE_PASSWORD: ${{ (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.KEY_PASSWORD || '' }}

      - name: Rename APKs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            SUFFIX="-${GITHUB_REF_NAME}"
          else
            SUFFIX=""
          fi
          mkdir -p apks
          cp app/build/outputs/apk/debug/app-debug.apk "apks/redeye${SUFFIX}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "apks/redeye${SUFFIX}-release.apk"
          ls -la apks/

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apks
          path: apks/*.apk
          if-no-files-found: error

  rilis:
    name: Terbitkan rilis
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Unduh artefak APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name apks --dir release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            release-assets/redeye-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
