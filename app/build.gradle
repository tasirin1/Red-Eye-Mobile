plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.redeye.parentalmonitor'

    defaultConfig {
        applicationId "com.redeye.parentalmonitor"
        manifestPlaceholders = [
            appIcon: "@mipmap/ic_launcher",
            appRoundIcon: "@mipmap/ic_launcher_round",
            appLabel: "@string/app_name"
        ]
        minSdk 24
        targetSdk 35
        versionCode 31
        versionName "1.6.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Interval sync default: hanya dari CI via -PSYNC_INTERVAL / env SYNC_INTERVAL.
        // Kredensial bot TIDAK pernah dibake ke APK; satu-satunya sumber adalah
        // input manual halaman Setup di aplikasi (SetupActivity).
        def syncIntervalProp = project.findProperty("SYNC_INTERVAL") ?: System.getenv("SYNC_INTERVAL") ?: "5"
        if (!"$syncIntervalProp".isInteger()) syncIntervalProp = "5"
        buildConfigField "int", "SYNC_INTERVAL", "${syncIntervalProp}"
    }
























    compileSdk 35


    def keystorePwd = System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("KEYSTORE_PASSWORD")
    def keyAliasVal = System.getenv("KEY_ALIAS") ?: project.findProperty("KEY_ALIAS")
    def keyPwd = System.getenv("KEY_PASSWORD") ?: project.findProperty("KEY_PASSWORD")
    if (file("release.p12").exists() && (keystorePwd == null || keyAliasVal == null || keyPwd == null)) {
        throw new GradleException("release.p12 present but KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD missing")
    }
    signingConfigs {
        release {
            storeFile file("release.p12")
            storeType "PKCS12"
            storePassword keystorePwd
            keyAlias keyAliasVal
            keyPassword keyPwd
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Keystore hanya ada di CI rilis; tanpanya pakai debug key agar build check tetap jalan.
            signingConfig = file("release.p12").exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding false
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    
    // WorkManager for background tasks
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    
    // Retrofit for HTTP requests (Telegram API)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // Gson for JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // SharedPreferences encryption
    implementation 'androidx.security:security-crypto:1.1.0'
    
    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.0.0'
    
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
