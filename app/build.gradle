plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'io.gitlab.arturbosch.detekt'
}

detekt {
    buildUponDefaultConfig = false
    config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
}

android {
    namespace 'com.redeye.parentalmonitor'

    defaultConfig {
        applicationId "com.redeye.parentalmonitor"
        manifestPlaceholders = [
            appIcon: "@mipmap/ic_launcher",
            appRoundIcon: "@mipmap/ic_launcher_round",
            appLabel: "@string/app_name"
        ]
        minSdk 24
        targetSdk 35
        versionCode 663
        versionName "1.6.636"

        // Interval sync default: hanya dari CI via -PSYNC_INTERVAL / env SYNC_INTERVAL.
        // Kredensial bot TIDAK pernah dibake ke APK; satu-satunya sumber adalah
        // input manual halaman Setup di aplikasi (SetupActivity).
        def syncIntervalProp = project.findProperty("SYNC_INTERVAL") ?: System.getenv("SYNC_INTERVAL") ?: "5"
        if (!"$syncIntervalProp".isInteger()) {
            logger.warn("SYNC_INTERVAL bukan angka bulat; memakai 5")
            syncIntervalProp = "5"
        }
        try {
            def syncInt = "${syncIntervalProp}".toInteger()
            if (syncInt < 1 || syncInt > 1440) {
                logger.warn("SYNC_INTERVAL di luar 1-1440; memakai 5")
                syncIntervalProp = "5"
            } else syncIntervalProp = "$syncInt"
        } catch (Exception ignored) {
            syncIntervalProp = "5"
        }
        buildConfigField "int", "SYNC_INTERVAL", "${syncIntervalProp}"
    }

    compileSdk 35


    def keystorePwd = System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("KEYSTORE_PASSWORD")
    def keyAliasVal = System.getenv("KEY_ALIAS") ?: project.findProperty("KEY_ALIAS")
    def keyPwd = System.getenv("KEY_PASSWORD") ?: project.findProperty("KEY_PASSWORD")
    if (file("release.p12").exists() && (keystorePwd == null || keyAliasVal == null || keyPwd == null)) {
        throw new GradleException("release.p12 present but KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD missing")
    }
    signingConfigs {
        release {
            storeFile file("release.p12")
            storeType "PKCS12"
            storePassword keystorePwd
            keyAlias keyAliasVal
            keyPassword keyPwd
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = file("release.p12").exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    tasks.register("assertReleaseKeystore") {
        doLast {
            if (file("release.p12").exists()) return
            // Penilaian "mau release" dari nama tugas yang
            // diminta dihapus (issue #1310): `gradle assemble`
            // generik ikut menjalankan assembleRelease tetapi
            // taskNames-nya hanya ["assemble"], jadi penjaga
            // melucuti dirinya sendiri dan ref tag/main lolos
            // tanpa keystore -> APK release bertanda tangan
            // debug. Tugas ini HANYA terpasang sebagai
            // dependensi assemble*Release, jadi terpicunya
            // tugas ini sendiri sudah berarti release akan
            // dirakit; keputusan cukup dari ref + keystore.
            // bundle*Release ikut dipasangi (issue #1330):
            // fallback tanda tangannya sama (debug bila
            // release.p12 tak ada) tetapi dulu tak terpicu
            // di ref mana pun; tak ada workflow yang memanggil
            // bundle, jadi pemasangan ini tak mengulang
            // jebakan CodeQL #1310.
            if ((System.getenv("ANDROID_KEYSTORE_BASE64") ?: "") != "") {
                throw new GradleException("ANDROID_KEYSTORE_BASE64 set but app/release.p12 missing")
            }
            def ref = System.getenv("GITHUB_REF") ?: ""
            if (ref.startsWith("refs/tags/v")) {
                throw new GradleException("Release tag build requires release keystore (ANDROID_KEYSTORE_BASE64 + KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD)")
            }
            // Ref main TANPA keystore dan TANPA env base64
            // SENGAJA dibiarkan (koreksi atas #1310, terbukti
            // oleh kegagalan CodeQL run 41801637510): autobuild
            // CodeQL menjalankan `assemble` generik di main
            // tanpa pernah mendekode keystore, dan workflow
            // Build utama selalu mendekode keystore bila
            // secret-nya ada — jadi assemble main tanpa
            // keystore menurut konstruksinya adalah build
            // analisis/non-distribusi. Jalur distribusi (tag)
            // dan keadaan secret-tak-konsisten di atas tetap
            // ter-gagal-kan.
        }
    }
    tasks.matching { (it.name.contains("assemble") || it.name.contains("bundle")) && it.name.contains("Release") }.configureEach {
        dependsOn("assertReleaseKeystore")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding false
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // WorkManager for background tasks
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Retrofit for HTTP requests (Telegram API)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Gson for JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'

    // SharedPreferences encryption
    implementation 'androidx.security:security-crypto:1.1.0'

    // Uji JVM untuk logika murni (tanpa Android)
    testImplementation 'junit:junit:4.13.2'

}
