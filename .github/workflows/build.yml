name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verifikasi:
    name: Cek path yang berubah
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verifikasi path (tanpa SDK Android)
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Skrip murni-Python: acuan yatim, XML, aturan repo, hapusan salah,
          # paritas resource, secret, cakupan uji metode diubah.
          # Gagal di sini = build APK tidak jalan.
          BASE="$PR_BASE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$EVENT_BEFORE"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            case "$GITHUB_REF" in
              refs/tags/*)
                BASE=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
                if [ -z "$BASE" ]; then
                  BASE=$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)
                fi
                ;;
              *)
                # Cabang baru (issue #893): before kosong/nol berarti
                # seluruh cabang baru bagi remote — cadangan lama
                # sha^ hanya memindai commit ujung. BASE menjadi
                # commit akar agar seluruh riwayat cabang ikut
                # terpindai (isi tiap commit + pesan + diff bersih).
                BASE=$(git rev-list --max-parents=0 "${GITHUB_SHA}" 2>/dev/null | head -n 1 || true)
                ;;
            esac
          fi
          if [ -n "$BASE" ]; then
            # Dua titik (issue #838): tiga titik = beda simetris,
            # memindai juga commit yang sudah duduk di main dan tak
            # disentuh perubahan ini (PR bersih bisa gagal dan tak
            # bisa diperbaiki dari sisi PR).
            python3 tools/verifikasi-path.py --rentang "$BASE..${{ github.sha }}"
          else
            python3 tools/verifikasi-path.py
          fi
      - name: Nilai judul & isi PR (gerbang token)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Judul & isi PR dinilai penilai pesan yang sama
          # (issue #1829): keduanya teks publik yang hidup
          # selama PR ada, tetapi tak terjangkau kanal
          # pesan commit/tag/branch mana pun karena
          # workflow hanya membaca base.sha. Nilai lewat
          # env, BUKAN interpolasi langsung di run, agar
          # judul PR tak bisa menyuntik skrip.
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | python3 tools/cek-token.py --teks-pesan | grep -q DITEMUKAN; then
            echo "Kemungkinan token bot asli di JUDUL/ISI PR - hapus token itu dari judul/isi PR. Kredensial hanya via input manual SetupActivity"
            exit 1
          fi
      - name: Cek cepat (vektor 0.x, secret, binary)
        run: bash scripts/cek-cepat.sh
      - name: Uji regresi gerbang Python
        # Issue #1817: langkah yang sama seperti workflow
        # Verifikasi (#1789), kini ikut menggerbang rantai
        # build/rilis (job ini digerbang build, dan rilis
        # needs build) — regresi gerbang yang hanya
        # tertangkap suite tak lagi bisa lolos menerbitkan
        # rilis dari tag yang sama.
        run: python3 -m unittest discover -s tools/tests

  build:
    needs: [verifikasi]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GRADLE_SHA256: bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle 8.14.3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /opt/gradle-8.14.3
          key: gradle-8.14.3-bin-${{ env.GRADLE_SHA256 }}

      - name: Setup Gradle 8.14.3
        run: |
          if [ -x /opt/gradle-8.14.3/bin/gradle ] && [ "$(cat /opt/gradle-8.14.3/.sha256 2>/dev/null)" = "$GRADLE_SHA256" ]; then
            echo "Gradle 8.14.3 dari cache terverifikasi."
          else
            rm -rf /opt/gradle-8.14.3 /tmp/gradle.zip
            wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -O /tmp/gradle.zip
            echo "$GRADLE_SHA256  /tmp/gradle.zip" | sha256sum -c -
            unzip -q /tmp/gradle.zip -d /opt
            echo "$GRADLE_SHA256" > /opt/gradle-8.14.3/.sha256
            rm -f /tmp/gradle.zip
          fi
          echo "/opt/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - name: Cek tag cocok versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          nama=$(sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' app/build.gradle | head -1)
          echo "tag=$tag versionName=$nama"
          if [ "$tag" != "$nama" ]; then
            echo "GAGAL: tag v$tag tidak cocok dengan versionName $nama"; exit 1
          fi

      - name: Unit test (logika murni)
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace 2>&1 | tee /tmp/unit.log
          s=${PIPESTATUS[0]}
          if [ "$s" -ne 0 ] && grep -Eqi 'could not (resolve|get|download)|connection (reset|timed out)|read timed out|temporary failure|unable to access' /tmp/unit.log; then
            echo "Kegagalan jaringan terdeteksi, mencoba sekali lagi"
            sleep 30
            gradle testDebugUnitTest --stacktrace && s=0
          fi
          exit "$s"
        env:
          SYNC_INTERVAL: ${{ secrets.SYNC_INTERVAL }}

      - name: Detekt (3 aturan dasar)
        run: gradle detekt --stacktrace

      # Android Lint (issue #1693): dulu CI tak punya langkah
      # lint sama sekali. Sengaja peringatan-saja dulu
      # (continue-on-error + laporan diunggah) karena backlog
      # temuan lama belum dipetakan — menggagalkan build
      # karenanya akan memblokir rilis; pengetatan jadi
      # gerbang (baseline) adalah tindak lanjut sesudah
      # backlog dibaca dari laporan ini.
      - name: Android Lint (peringatan saja)
        continue-on-error: true
        run: gradle lintDebug --stacktrace

      - name: Upload laporan Lint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-report
          if-no-files-found: ignore
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.p12
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APKs
        run: |
          set +e
          gradle assembleDebug assembleRelease --stacktrace 2>&1 | tee /tmp/build.log
          s=${PIPESTATUS[0]}
          if [ "$s" -ne 0 ] && grep -Eqi 'could not (resolve|get|download)|connection (reset|timed out)|read timed out|temporary failure|unable to access' /tmp/build.log; then
            echo "Kegagalan jaringan terdeteksi, mencoba sekali lagi"
            sleep 30
            gradle assembleDebug assembleRelease --stacktrace && s=0
          fi
          exit "$s"
        env:
          SYNC_INTERVAL: ${{ secrets.SYNC_INTERVAL }}
          KEYSTORE_PASSWORD: ${{ (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.KEY_PASSWORD || '' }}

      - name: Rename APKs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            SUFFIX="-${GITHUB_REF_NAME}"
          else
            SUFFIX=""
          fi
          mkdir -p apks
          cp app/build/outputs/apk/debug/app-debug.apk "apks/redeye${SUFFIX}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "apks/redeye${SUFFIX}-release.apk"
          ls -la apks/

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apks
          path: apks/*.apk
          if-no-files-found: error

  rilis:
    name: Terbitkan rilis
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Ambil sumber tag untuk CHANGELOG
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Susun catatan rilis dari CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          versi="${GITHUB_REF_NAME#v}"
          awk -v v="$versi" '
            index($0, "## [" v "]") == 1 { f = 1; print; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ] || ! grep -v '^#' release-notes.md | grep -q '[^[:space:]]'; then
            # Gagalkan rilis (issue #908): fallback header kosong
            # dulu membuat tag tanpa seksi CHANGELOG tetap
            # terbit dengan catatan rilis hampa. Rilis wajib
            # punya catatan yang ditulis manusia.
            # Seksi yang judulnya ada tapi isinya kosong juga
            # digagalkan (issue #974): awk selalu mencetak baris
            # judul lebih dulu, jadi uji -s saja lolos untuk
            # berkas berisi judul semata — kini wajib ada baris
            # isi (non-kosong) selain judul. Semua baris tajuk
            # (#/##/###) disisihkan sebelum uji isi (issue
            # #1026): subjudul kategori seperti ### Fixed
            # tanpa entri pun dulu ikut lolos sebagai "isi".
            echo "::error::Seksi CHANGELOG untuk versi $versi tidak ditemukan/kosong - rilis dibatalkan. Tulis entri ## [$versi] di CHANGELOG.md dulu."
            exit 1
          fi
          prev="$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$prev" ] && [ "$prev" != "$GITHUB_REF_NAME" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> release-notes.md
          fi

      - name: Unduh artefak APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name apks --dir release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            release-assets/redeye-*-release.apk
          fail_on_unmatched_files: true
          body_path: release-notes.md
