plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.redeye.parentalmonitor'

    defaultConfig {
        applicationId "com.redeye.parentalmonitor"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Telegram settings: SELALU kosong di repo.
        // Nilai hanya diisi saat CI (GitHub Actions) via -PBOT_TOKEN/-PCHAT_ID/-PSYNC_INTERVAL.
        // Pemakaian normal: input manual dari halaman Setup di aplikasi (SetupActivity).
        def botTokenProp = project.findProperty("BOT_TOKEN") ?: System.getenv("BOT_TOKEN") ?: ""
        def chatIdProp = project.findProperty("CHAT_ID") ?: System.getenv("CHAT_ID") ?: ""
        def syncIntervalProp = project.findProperty("SYNC_INTERVAL") ?: System.getenv("SYNC_INTERVAL") ?: "5"
        buildConfigField "String", "BOT_TOKEN", "\"${botTokenProp}\""
        buildConfigField "String", "CHAT_ID", "\"${chatIdProp}\""
        buildConfigField "int", "SYNC_INTERVAL", "${syncIntervalProp}"
    }
























    compileSdk 34


    signingConfigs {
        release {
            storeFile file("release.p12")
            storeType "PKCS12"
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEY_ALIAS") ?: project.findProperty("KEY_ALIAS") ?: "redeye"
            keyPassword System.getenv("KEY_PASSWORD") ?: project.findProperty("KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Keystore hanya ada di CI rilis; tanpanya pakai debug key agar build check tetap jalan.
            signingConfig = file("release.p12").exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    
    // WorkManager for background tasks
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    
    // Retrofit for HTTP requests (Telegram API)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Gson for JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // SharedPreferences encryption
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.0.0'
    
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

