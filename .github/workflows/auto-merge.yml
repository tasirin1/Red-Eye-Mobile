name: Auto-merge dependabot

# SYARAT repo: Settings > General > "Allow auto-merge" HARUS aktif
# (issue #1291: tanpa itu langkah `gh pr merge --auto` selalu
# gagal "Auto-merge is not allowed for this repository").
# Diaktifkan via API 2026-11-04 dan terverifikasi allow_auto_merge
# = true; proteksi branch main (wajib cek "build" hijau +
# resolusi percakapan) membuat --auto tetap menunggu CI.

# Hanya untuk PR Dependabot. Dependabot di repo ini memantau github-actions
# dan gradle (sejak pemerataan sesi #336); PR yang menyentuh dependensi Gradle
# tetap manual (hanya diberi komentar panduan), PR non-Gradle di-auto-merge
# sesudah CI hijau. Pola ditiru dari tasirin-download-manager.
on:
  pull_request_target:
    types: [opened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge PR Dependabot
    runs-on: ubuntu-24.04
    # Batas waktu job (issue #1957): tanpa ini job yang
    # menggantung membakar runner sampai bawaan GitHub
    # 360 menit; workflow saudara dibatasi di #1874/#1941.
    timeout-minutes: 10
    if: github.actor == 'dependabot[bot]'
    steps:
      # Murni API (tanpa checkout): semua perintah gh memakai -R eksplisit.
      - name: Deteksi perubahan dependensi Gradle
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Gagal-TERTUTUP: kegagalan API / daftar kosong tidak boleh jatuh
          # ke "bukan dependensi Gradle" lalu auto-merge aktif.
          # Daftar berkas wajib LENGKAP (issue #978): --json files
          # pada gh pr view terpotong di 100 berkas, jadi PR besar
          # bisa menyembunyikan berkas Gradle di ekor daftar dan
          # lolos auto-merge. Kini REST API ber-paginate + cek
          # silang jumlah terhadap changedFiles; selisih = batal.
          if ! FILES=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --jq '.[].filename'); then
            echo "::error::Gagal membaca daftar file PR - auto-merge dibatalkan."
            exit 1
          fi
          if [ -z "$FILES" ]; then
            echo "::error::Daftar file PR kosong - auto-merge dibatalkan."
            exit 1
          fi
          if ! JUMLAH=$(gh pr view ${{ github.event.pull_request.number }} -R ${{ github.repository }} --json changedFiles --jq '.changedFiles'); then
            echo "::error::Gagal membaca jumlah file PR - auto-merge dibatalkan."
            exit 1
          fi
          if [ "$(printf '%s\n' "$FILES" | wc -l)" -ne "$JUMLAH" ]; then
            echo "::error::Daftar file PR tidak lengkap ($JUMLAH berkas menurut PR) - auto-merge dibatalkan."
            exit 1
          fi
          echo "File berubah di PR:"
          echo "$FILES"
          if echo "$FILES" | grep -qE '^(app/build\.gradle|build\.gradle|settings\.gradle|gradle/|gradle\.properties)'; then
            echo "GRADLE_DEPS=true" >> "$GITHUB_ENV"
          fi

      - name: Komentar panduan (PR dependensi Gradle)
        if: env.GRADLE_DEPS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} -R ${{ github.repository }} --body "PR ini mengubah dependensi Gradle. Sesuai aturan repo, perubahan dependensi ditangani manual: pastikan build CI hijau dulu, lalu merge manual."

      - name: Auto-merge setelah CI hijau (bukan dependensi Gradle)
        if: env.GRADLE_DEPS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} -R ${{ github.repository }} --merge --auto
