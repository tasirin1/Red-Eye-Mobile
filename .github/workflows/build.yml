name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verifikasi:
    name: Cek path yang berubah
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verifikasi path (tanpa SDK Android)
        run: |
          # Skrip murni-Python: acuan yatim, XML, aturan repo, hapusan salah,
          # paritas resource, secret, cakupan uji metode diubah.
          # Gagal di sini = build APK tidak jalan.
          python3 tools/verifikasi-path.py --rentang "${{ github.event.pull_request.base.sha || github.event.before || '' }}...${{ github.sha }}"
      - name: Cek cepat (vektor 0.x, secret, binary)
        run: bash scripts/cek-cepat.sh

  build:
    needs: [verifikasi]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle 8.7
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /opt/gradle-8.7
          key: gradle-8.7-bin

      - name: Setup Gradle 8.7
        run: |
          if [ ! -x /opt/gradle-8.7/bin/gradle ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
          fi
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Unit test (logika murni)
        run: |
          for i in 1 2 3; do
            gradle testDebugUnitTest --stacktrace && break || s=$?
            if [ "$i" -eq 3 ]; then exit "$s"; fi
            sleep $((i * 60))
          done
        env:
          SYNC_INTERVAL: ${{ secrets.SYNC_INTERVAL }}

      - name: Detekt (gaya Kotlin)
        run: gradle detekt --stacktrace

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.p12
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APKs
        run: |
          for i in 1 2 3; do
            gradle assembleDebug assembleRelease --stacktrace && break || s=$?
            if [ "$i" -eq 3 ]; then exit "$s"; fi
            sleep $((i * 60))
          done
        env:
          SYNC_INTERVAL: ${{ secrets.SYNC_INTERVAL }}
          KEYSTORE_PASSWORD: ${{ (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.KEY_PASSWORD || '' }}

      - name: Rename APKs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            SUFFIX="-${GITHUB_REF_NAME}"
          else
            SUFFIX=""
          fi
          mkdir -p apks
          cp app/build/outputs/apk/debug/app-debug.apk "apks/redeye${SUFFIX}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "apks/redeye${SUFFIX}-release.apk"
          ls -la apks/

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apks
          path: |
            apks/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  rilis:
    name: Terbitkan rilis
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Unduh artefak APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name apks --dir release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            release-assets/apks/redeye-*.apk
          generate_release_notes: true
