name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Decode release keystore
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.p12
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Standard APKs
        run: gradle assembleDebug assembleRelease --stacktrace
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SYNC_INTERVAL: ${{ secrets.SYNC_INTERVAL }}
          PARENTAL_UI: "false"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Stash standard APKs
        run: |
          mkdir -p /tmp/standard
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/standard/
          cp app/build/outputs/apk/release/app-release.apk /tmp/standard/

      - name: Build Parental APKs
        run: gradle assembleDebug assembleRelease --stacktrace
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SYNC_INTERVAL: ${{ secrets.SYNC_INTERVAL }}
          PARENTAL_UI: "true"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            SUFFIX="-${GITHUB_REF_NAME}"
          else
            SUFFIX=""
          fi
          mkdir -p apks
          cp /tmp/standard/app-debug.apk "apks/redeye${SUFFIX}-debug.apk"
          cp /tmp/standard/app-release.apk "apks/redeye${SUFFIX}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "apks/parental${SUFFIX}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "apks/parental${SUFFIX}-release.apk"
          ls -la apks/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apks/redeye-*.apk
            apks/parental-*.apk
          generate_release_notes: true
